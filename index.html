<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - BCP Edu College</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(-45deg, #1e3a8a, #2563eb, #3b82f6, #60a5fa);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('https://bcpeducollege.elearningcommons.com/pluginfile.php/1/theme_alpha/customloginlogo/1740076289/bcp-olp-logo-mini2%20%281%29.png') no-repeat center center/contain;
      opacity: 0.1;
      z-index: 0;
      pointer-events: none;
      filter: grayscale(80%) brightness(150%);
    }
    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen relative z-10">
  <div id="particles-js"></div>
  <div class="bg-white bg-opacity-95 rounded-lg shadow-2xl p-10 max-w-md w-full relative z-10">
    <div class="mb-8 text-center">
      <img src="https://bcpeducollege.elearningcommons.com/pluginfile.php/1/theme_alpha/customloginlogo/1740076289/bcp-olp-logo-mini2%20%281%29.png" alt="Bestlink College of the Philippines" class="mx-auto mb-6 w-36" />
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-wide">Log in to the site | BCP</h1>
    </div>
    <form class="space-y-8" action="homepage.html" method="GET" novalidate>
      <div>
        <label for="username" class="block text-gray-800 font-semibold mb-3">Username</label>
        <input type="text" id="username" name="username" required placeholder="Enter your username" class="w-full px-5 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-500 focus:border-blue-500 transition" />
        <p class="mt-1 text-sm text-red-600 hidden" id="usernameError">Username is required.</p>
      </div>
      <div>
        <label for="password" class="block text-gray-800 font-semibold mb-3">Password</label>
        <div class="relative">
          <input type="password" id="password" name="password" required placeholder="Enter your password" class="w-full px-5 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-500 focus:border-blue-500 transition" />
          <button type="button" id="togglePassword" class="absolute right-4 top-3 text-gray-600 focus:outline-none" aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <p class="mt-1 text-sm text-red-600 hidden" id="passwordError">Password is required.</p>
      </div>
      <div class="text-right">
        <a href="#" class="text-blue-600 hover:underline text-sm font-medium">Forgotten your username or password?</a>
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Log in</button>
    </form>
    <p class="mt-8 text-sm text-gray-300 text-center">
      BCP SMS and LMS are using same username and password.<br />
      Visit Ascendens Asia office at BCP MV Campus or Bulacan Campus if you are having hard times logging in to your account.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particles-js', {
      "particles": {
        "number": {
          "value": 50,
          "density": {
            "enable": true,
            "value_area": 800
          }
        },
        "color": {
          "value": "#ffffff"
        },
        "shape": {
          "type": "circle"
        },
        "opacity": {
          "value": 0.3,
          "random": true
        },
        "size": {
          "value": 3,
          "random": true
        },
        "move": {
          "enable": true,
          "speed": 1,
          "direction": "none",
          "random": true,
          "straight": false,
          "out_mode": "out"
        }
      },
      "interactivity": {
        "events": {
          "onhover": {
            "enable": true,
            "mode": "repulse"
          }
        }
      }
    });

    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    const username = document.getElementById('username');
    const form = document.querySelector('form');
    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');

    togglePassword.addEventListener('click', () => {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      togglePassword.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;
      if (!username.value.trim()) {
        usernameError.classList.remove('hidden');
        valid = false;
      } else {
        usernameError.classList.add('hidden');
      }
      if (!password.value.trim()) {
        passwordError.classList.remove('hidden');
        valid = false;
      } else {
        passwordError.classList.add('hidden');
      }
      if (!valid) {
        return;
      }
      // Simulate login validation (for demo, accept any non-empty username/password)
      // Save username to localStorage for use in homepage
      localStorage.setItem('username', username.value.trim());
      // Redirect to homepage
      window.location.href = 'homepage.html';
    });
  </script>
</body>
</html>
