<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filipino sa iba't-ibang Disiplina - Lessons</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(-45deg, #f97316, #facc15, #22c55e, #3b82f6);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    header {
      background: rgba(255 255 255 / 0.9);
      backdrop-filter: saturate(180%) blur(10px);
      box-shadow: 0 2px 8px rgb(0 0 0 / 0.1);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    main {
      max-width: 6xl;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    #lesson-content {
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 8px 15px rgb(0 0 0 / 0.1);
      padding: 1.5rem;
      min-height: 300px;
      overflow-y: auto;
      transition: box-shadow 0.3s ease;
    }
    #lesson-content:hover {
      box-shadow: 0 15px 25px rgb(0 0 0 / 0.2);
    }
    aside {
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 8px 15px rgb(0 0 0 / 0.1);
      padding: 1rem;
      max-height: calc(100vh - 5rem);
      overflow-y: auto;
      transition: box-shadow 0.3s ease;
    }
    aside:hover {
      box-shadow: 0 15px 25px rgb(0 0 0 / 0.2);
    }
    #searchInput {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.5rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      outline: none;
      transition: box-shadow 0.3s ease;
    }
    #searchInput:focus {
      box-shadow: 0 0 0 3px #3b82f6;
      border-color: #3b82f6;
    }
    button.lesson-btn {
      background-color: #2563eb;
      color: white;
      border-radius: 0.375rem;
      padding: 0.5rem 1rem;
      font-weight: 600;
      text-align: left;
      transition: background-color 0.3s ease, transform 0.3s ease;
      width: 100%;
      margin-bottom: 0.75rem;
      cursor: pointer;
      box-shadow: 0 8px 15px rgb(0 0 0 / 0.1);
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    button.lesson-btn:hover {
      background-color: #1e40af;
      box-shadow: 0 15px 25px rgb(0 0 0 / 0.2);
      transform: translateY(-3px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-50">
  <header class="py-4 px-6 flex justify-between items-center sticky top-0 z-20 bg-white shadow-md">
    <h1 class="text-2xl font-bold text-gray-900">Filipino sa iba't-ibang Disiplina - Lessons</h1>
    <a href="homepage.html" class="text-blue-600 hover:underline font-semibold flex items-center space-x-2">
      <i class="fas fa-arrow-left"></i>
      <span>Back to Subjects</span>
    </a>
  </header>
  <main class="flex-grow max-w-6xl mx-auto p-6 flex flex-col md:flex-row gap-8">
    <aside>
      <input type="text" id="searchInput" placeholder="Search lessons..." />
      <div id="lessons-list">
        <!-- Lesson buttons generated by script -->
      </div>
    </aside>
    <section id="lesson-content" class="relative">
      <p class="text-gray-700 italic">Select a lesson to view its content.</p>
      <div id="lesson-nav" class="absolute bottom-4 right-4 flex space-x-4">
        <button id="prevLesson" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Previous</button>
        <button id="nextLesson" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Next</button>
      </div>
    </section>
  </main>

  <script>
    const lessonsList = document.getElementById('lessons-list');
    const lessonContent = document.getElementById('lesson-content');
    const searchInput = document.getElementById('searchInput');
    const prevBtn = document.getElementById('prevLesson');
    const nextBtn = document.getElementById('nextLesson');

    let currentLesson = null;

    // Create 17 lesson buttons
    for (let i = 1; i <= 17; i++) {
      const btn = document.createElement('button');
      btn.textContent = 'Lesson ' + i;
      btn.className = 'lesson-btn';
      btn.dataset.lesson = i;
      btn.addEventListener('click', () => {
        showLesson(i);
      });
      lessonsList.appendChild(btn);
    }

    function showLesson(i) {
      currentLesson = i;
      lessonContent.innerHTML = '<h2 class="text-2xl font-bold mb-4">Lesson ' + i + '</h2><p class="text-gray-700 leading-relaxed">This is placeholder content for Lesson ' + i + '.</p><button id="markCompleted" class="mt-4 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">Mark as Completed</button>';
      lessonContent.scrollTop = 0;
      updateNavButtons();
      updateMarkCompletedButton();
      document.getElementById('markCompleted').addEventListener('click', toggleCompleted);
    }

    function updateNavButtons() {
      prevBtn.disabled = currentLesson <= 1;
      nextBtn.disabled = currentLesson >= 17;
    }

    prevBtn.addEventListener('click', () => {
      if (currentLesson > 1) {
        showLesson(currentLesson - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentLesson < 17) {
        showLesson(currentLesson + 1);
      }
    });

    function toggleCompleted() {
      const key = 'lessonCompleted_' + currentLesson;
      const completed = localStorage.getItem(key) === 'true';
      if (completed) {
        localStorage.removeItem(key);
      } else {
        localStorage.setItem(key, 'true');
      }
      updateMarkCompletedButton();
      updateLessonButton(currentLesson);
    }

    function updateMarkCompletedButton() {
      const key = 'lessonCompleted_' + currentLesson;
      const completed = localStorage.getItem(key) === 'true';
      const btn = document.getElementById('markCompleted');
      if (completed) {
        btn.textContent = 'Mark as Incomplete';
        btn.classList.remove('bg-green-600');
        btn.classList.add('bg-red-600');
        btn.classList.remove('hover:bg-green-700');
        btn.classList.add('hover:bg-red-700');
      } else {
        btn.textContent = 'Mark as Completed';
        btn.classList.add('bg-green-600');
        btn.classList.remove('bg-red-600');
        btn.classList.add('hover:bg-green-700');
        btn.classList.remove('hover:bg-red-700');
      }
    }

    function updateLessonButton(i) {
      const btns = lessonsList.querySelectorAll('button');
      btns.forEach(btn => {
        if (parseInt(btn.dataset.lesson) === i) {
          const key = 'lessonCompleted_' + i;
          const completed = localStorage.getItem(key) === 'true';
          if (completed) {
            btn.classList.add('line-through', 'opacity-60');
          } else {
            btn.classList.remove('line-through', 'opacity-60');
          }
        }
      });
    }

    // Filter lessons based on search input
    searchInput.addEventListener('input', () => {
      const filter = searchInput.value.toLowerCase();
      const buttons = lessonsList.querySelectorAll('button');
      buttons.forEach(btn => {
        const text = btn.textContent.toLowerCase();
        btn.style.display = text.includes(filter) ? 'block' : 'none';
      });
    });

    // Initialize lesson buttons completed state on load
    window.addEventListener('load', () => {
      for (let i = 1; i <= 17; i++) {
        updateLessonButton(i);
      }
    });
  </script>
</body>
</html>
