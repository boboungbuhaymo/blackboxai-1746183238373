<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BCP Edu College - Subjects</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(-45deg, #f97316, #facc15, #22c55e, #3b82f6);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    header {
      background: rgba(255 255 255 / 0.9);
      backdrop-filter: saturate(180%) blur(10px);
      box-shadow: 0 2px 8px rgb(0 0 0 / 0.1);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    main {
      max-width: 6xl;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .subject-btn {
      transition: all 0.3s ease;
      box-shadow: 0 8px 15px rgb(0 0 0 / 0.1);
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    .subject-btn:hover {
      box-shadow: 0 15px 25px rgb(0 0 0 / 0.2);
      transform: translateY(-5px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-50">
  <header class="py-4 px-6 flex justify-between items-center sticky top-0 z-20 bg-white shadow-md">
    <h1 class="text-2xl font-bold text-gray-900">BCP Edu College</h1>
    <div class="flex items-center space-x-4">
      <p id="welcomeMsg" class="text-gray-700 font-semibold"></p>
      <button id="logoutBtn" class="text-gray-700 hover:text-gray-900 font-semibold flex items-center space-x-2 focus:outline-none">
        <i class="fas fa-sign-out-alt"></i>
        <span>Logout</span>
      </button>
      <button id="darkModeToggle" class="text-gray-700 hover:text-gray-900 font-semibold flex items-center space-x-2 focus:outline-none" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>
  <main class="flex-grow">
    <h2 class="text-3xl font-extrabold text-gray-800 mb-10 text-center">Select a Subject</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 max-w-6xl mx-auto px-6">
      <a href="#" class="subject-btn bg-gradient-to-r from-purple-500 to-indigo-600 text-white rounded-lg p-8 flex flex-col items-center justify-center text-center font-semibold text-lg hover:from-purple-600 hover:to-indigo-700">
        <i class="fas fa-drum text-4xl mb-4"></i>
        Folk Dance and Rhythmic Activities
      </a>
      <a href="#" class="subject-btn bg-gradient-to-r from-green-500 to-teal-600 text-white rounded-lg p-8 flex flex-col items-center justify-center text-center font-semibold text-lg hover:from-green-600 hover:to-teal-700">
        <i class="fas fa-hands-helping text-4xl mb-4"></i>
        National Service Training Program 2
      </a>
      <a href="filipino.html" class="subject-btn bg-gradient-to-r from-yellow-500 to-orange-500 text-white rounded-lg p-8 flex flex-col items-center justify-center text-center font-semibold text-lg hover:from-yellow-600 hover:to-orange-600">
        <i class="fas fa-book-open text-4xl mb-4"></i>
        Filipino sa iba't-ibang Disiplina
      </a>
      <a href="#" class="subject-btn bg-gradient-to-r from-pink-500 to-red-500 text-white rounded-lg p-8 flex flex-col items-center justify-center text-center font-semibold text-lg hover:from-pink-600 hover:to-red-600">
        <i class="fas fa-laptop-code text-4xl mb-4"></i>
        Computer Programming 2
      </a>
      <a href="#" class="subject-btn bg-gradient-to-r from-blue-500 to-cyan-600 text-white rounded-lg p-8 flex flex-col items-center justify-center text-center font-semibold text-lg hover:from-blue-600 hover:to-cyan-700">
        <i class="fas fa-calculator text-4xl mb-4"></i>
        Discrete Mathematics
      </a>
      <a href="#" class="subject-btn bg-gradient-to-r from-gray-700 to-gray-900 text-white rounded-lg p-8 flex flex-col items-center justify-center text-center font-semibold text-lg hover:from-gray-800 hover:to-gray-900">
        <i class="fas fa-balance-scale text-4xl mb-4"></i>
        Ethics
      </a>
      <a href="#" class="subject-btn bg-gradient-to-r from-indigo-700 to-purple-800 text-white rounded-lg p-8 flex flex-col items-center justify-center text-center font-semibold text-lg hover:from-indigo-800 hover:to-purple-900">
        <i class="fas fa-flask text-4xl mb-4"></i>
        Science and Technology (ST) and Society
      </a>
      <a href="#" class="subject-btn bg-gradient-to-r from-red-700 to-pink-800 text-white rounded-lg p-8 flex flex-col items-center justify-center text-center font-semibold text-lg hover:from-red-800 hover:to-pink-900">
        <i class="fas fa-palette text-4xl mb-4"></i>
        Art Appreciation
      </a>
      <a href="#" class="subject-btn bg-gradient-to-r from-teal-700 to-green-800 text-white rounded-lg p-8 flex flex-col items-center justify-center text-center font-semibold text-lg hover:from-teal-800 hover:to-green-900">
        <i class="fas fa-comments text-4xl mb-4"></i>
        Purposive Communication
      </a>
    </div>
  </main>
  <script>
    // Display welcome message
    const welcomeMsg = document.getElementById('welcomeMsg');
    const username = localStorage.getItem('username');
    if (username) {
      welcomeMsg.textContent = `Welcome, ${username}!`;
    } else {
      welcomeMsg.textContent = '';
    }

    // Logout button functionality
    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('username');
      window.location.href = 'index.html';
    });

    // Dark mode toggle
    const darkModeToggle = document.getElementById('darkModeToggle');
    darkModeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      // Save preference
      if (document.documentElement.classList.contains('dark')) {
        localStorage.setItem('darkMode', 'enabled');
      } else {
        localStorage.setItem('darkMode', 'disabled');
      }
    });

    // Load dark mode preference
    if (localStorage.getItem('darkMode') === 'enabled') {
      document.documentElement.classList.add('dark');
    }
  </script>
</body>
</html>
